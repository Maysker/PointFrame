[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pointframe"
version = "0.1.1"
description = "Local-first point-cloud alignment and precision cropping tool"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/Maysker/PointFrame"
Repository = "https://github.com/Maysker/PointFrame"
Issues = "https://github.com/Maysker/PointFrame/issues"

[project.optional-dependencies]
desktop = ["pywebview[gtk]>=5"]
test = ["pytest>=9"]

[project.scripts]
pointframe = "pointframe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pointframe = ["crop_web/*.html", "crop_web/*.css", "crop_web/*.js"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
